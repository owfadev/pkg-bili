[project]
name = "bilicli"
version = "0.3.0"
description = "bilibili (bilibili.com) read-mostly CLI connector with web-cookie auth"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.scripts]
bili-cli = "bilicli.cli:main"
bili-pet = "bilicli.pet_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bilicli"]
